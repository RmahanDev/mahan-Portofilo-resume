<p>یاد گرفتن طراحی سایت از صفر، مثل هر مهارت دیگری، با داشتن نقشه آسان‌تر می‌شود. مشکل بیشتر مبتدی‌ها کمبود منبع نیست؛ زیادی منبع است و ندانستن اینکه از کجا شروع کنند و به چه ترتیبی پیش بروند. این مقاله یک مسیر مرحله‌به‌مرحله و چند اصل یادگیری را معرفی می‌کند که کمک می‌کند سریع‌تر و محکم‌تر جلو بروید.</p>
